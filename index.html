<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08050a">
<meta name="robots" content="noindex, nofollow">
<title>Un universo para Jimenita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08050a;
    --void-2:#150d0b;
    --cafe:#6b3f1d;
    --cafe-deep:#2a150b;
    --ambar:#e09a28;
    --flor:#f6d65c;
    --luz:#fff6d8;
    --tinta:rgba(255,246,216,.82);
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --script:"Great Vibes", "Cormorant Garamond", cursive;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden}
  body{
    font-family:var(--serif);color:var(--tinta);
    overscroll-behavior:none;touch-action:none;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block}
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #petals{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

  /* Atmósfera: viñeta cálida + grano sutil */
  #vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 45%, transparent 42%, rgba(10,5,3,.55) 78%, rgba(6,3,2,.92) 100%),
      radial-gradient(70% 50% at 50% 100%, rgba(107,63,29,.18), transparent 70%);
    mix-blend-mode:multiply;
  }
  #grain{
    position:fixed;inset:-50%;z-index:4;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(3) infinite;
  }
  @keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}

  /* ---------- Portada ---------- */
  #intro{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:radial-gradient(90% 70% at 50% 50%, #120a08 0%, #07040a 60%, #050308 100%);
    transition:opacity 2.2s ease, visibility 2.2s;
    padding:8vh 7vw;text-align:center;
  }
  #intro.gone{opacity:0;visibility:hidden}
  .intro-inner{max-width:30rem}
  .intro-eyebrow{
    font-size:clamp(.82rem,2.4vw,1rem);letter-spacing:.34em;
    color:rgba(255,246,216,.4);margin:0 0 1.6rem;font-weight:300;
    opacity:0;animation:rise 1.6s .4s cubic-bezier(.22,1,.36,1) forwards;
  }
  .intro-name{
    font-family:var(--script);
    font-size:clamp(3.6rem,17vw,7.5rem);line-height:.95;margin:0;
    color:#fff3cf;
    text-shadow:0 0 42px rgba(246,214,92,.45), 0 0 120px rgba(224,154,40,.28);
    opacity:0;animation:rise 2.2s .55s cubic-bezier(.22,1,.36,1) forwards;
  }
  .intro-sub{
    font-size:clamp(1rem,3.6vw,1.22rem);font-weight:300;font-style:italic;
    color:rgba(255,246,216,.6);margin:1.7rem 0 3rem;line-height:1.7;
    opacity:0;animation:rise 1.8s 1.5s cubic-bezier(.22,1,.36,1) forwards;
  }
  #enter{
    font-family:var(--serif);font-size:1.05rem;letter-spacing:.18em;
    color:#ffeeb8;background:transparent;cursor:pointer;
    border:1px solid rgba(246,214,92,.34);border-radius:999px;
    padding:.95rem 2.7rem;
    opacity:0;animation:rise 1.3s 2.2s cubic-bezier(.22,1,.36,1) forwards;
    transition:background .6s ease, border-color .6s ease, color .6s ease, transform .6s ease;
  }
  #enter:hover,#enter:focus-visible{
    background:rgba(246,214,92,.1);border-color:rgba(246,214,92,.75);
    color:#fff8e0;transform:translateY(-2px);outline:none;
  }
  .intro-music{margin:1.5rem 0 0;opacity:0;animation:rise 1.2s 2.5s ease forwards}
  .intro-music a{
    font-size:.86rem;letter-spacing:.14em;color:rgba(246,214,92,.55);
    text-decoration:none;border-bottom:1px solid rgba(246,214,92,.2);padding-bottom:3px;
    transition:color .4s,border-color .4s;
  }
  .intro-music a:hover,.intro-music a:focus-visible{color:#ffeeb8;border-color:rgba(246,214,92,.6);outline:none}

  /* Reproductor oculto de YouTube: permite que Yellow suene dentro de la experiencia
     después del toque del usuario en “Entrar”, igual que en la versión de Mónaco. */
  #ytShell{
    position:fixed;width:220px;height:124px;left:-500px;top:-500px;
    opacity:.001;pointer-events:none;z-index:-1;overflow:hidden;
  }
  #ytplayer{width:220px;height:124px}
  .intro-foot{
    margin:2.4rem 0 0;font-size:.78rem;letter-spacing:.24em;
    color:rgba(255,246,216,.22);opacity:0;animation:rise 1.2s 2.8s ease forwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* ---------- Subtítulos cinemáticos ---------- */
  #chapter{
    position:fixed;left:0;right:0;bottom:16vh;z-index:12;
    display:flex;justify-content:center;pointer-events:none;padding:0 10vw;
  }
  #chapter p{
    margin:0;max-width:26rem;text-align:center;line-height:1.75;
    font-size:clamp(1.05rem,4.2vw,1.45rem);font-style:italic;font-weight:300;
    color:rgba(255,246,216,.88);
    text-shadow:0 2px 30px rgba(0,0,0,.9);
    opacity:0;transition:opacity 2.4s ease, transform 2.4s cubic-bezier(.22,1,.36,1);
    transform:translateY(14px);
  }
  #chapter p.on{opacity:1;transform:none}

  /* ---------- HUD mínimo ---------- */
  #hud{
    position:fixed;z-index:12;inset:0;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 1.1rem) 1.2rem calc(env(safe-area-inset-bottom) + 1.1rem);
    opacity:0;transition:opacity 2s ease;
  }
  #hud.on{opacity:1}
  #count{
    position:absolute;top:calc(env(safe-area-inset-top) + 1.1rem);left:1.3rem;
    font-size:.86rem;letter-spacing:.26em;color:rgba(255,246,216,.45);
  }
  #count b{font-weight:400;color:#f6d65c}
  #sound{
    position:absolute;top:calc(env(safe-area-inset-top) + .75rem);right:1rem;
    pointer-events:auto;cursor:pointer;background:none;border:none;
    width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    color:rgba(255,246,216,.5);transition:color .4s;
  }
  #sound:hover,#sound:focus-visible{color:#f6d65c;outline:none}
  #sound svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  #hint{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 1.6rem);
    font-size:.82rem;letter-spacing:.2em;color:rgba(255,246,216,.35);
    text-align:center;line-height:1.9;transition:opacity 1.4s ease;
  }

  /* ---------- Mensaje de una flor ---------- */
  #card{
    position:fixed;z-index:14;left:50%;bottom:0;transform:translate(-50%,24px);
    width:min(30rem,92vw);
    padding:2.6rem 2.2rem calc(2.4rem + env(safe-area-inset-bottom));
    margin-bottom:max(3vh,1rem);
    border-radius:26px 26px 22px 22px;
    background:linear-gradient(175deg, rgba(42,21,11,.78), rgba(12,7,10,.9));
    border:1px solid rgba(246,214,92,.18);
    box-shadow:0 -10px 90px rgba(224,154,40,.16), 0 30px 80px rgba(0,0,0,.6);
    backdrop-filter:blur(18px) saturate(1.1);
    -webkit-backdrop-filter:blur(18px) saturate(1.1);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .9s ease, transform 1.1s cubic-bezier(.22,1,.36,1), visibility .9s;
    text-align:center;
  }
  #card.on{opacity:1;visibility:visible;transform:translate(-50%,0);pointer-events:auto}
  #card .mark{
    display:block;width:26px;height:26px;margin:0 auto 1.3rem;opacity:.9;
  }
  #card h2{
    font-family:var(--script);font-weight:400;
    font-size:clamp(1.9rem,7vw,2.5rem);margin:0 0 1rem;color:#ffeeb8;
    text-shadow:0 0 30px rgba(246,214,92,.3);
  }
  #card p{
    margin:0;font-size:clamp(1.02rem,4vw,1.16rem);line-height:1.85;
    font-weight:300;color:rgba(255,246,216,.85);
  }
  #card button{
    margin-top:2rem;font-family:var(--serif);font-size:.88rem;letter-spacing:.22em;
    color:rgba(255,246,216,.5);background:none;border:none;cursor:pointer;
    padding:.5rem 1rem;transition:color .4s;
  }
  #card button:hover,#card button:focus-visible{color:#f6d65c;outline:none}

  /* ---------- Final ---------- */
  #finale{
    position:fixed;inset:0;z-index:13;display:grid;place-items:end center;
    padding:0 8vw calc(9vh + env(safe-area-inset-bottom));
    pointer-events:none;text-align:center;
  }
  #finale .txt{
    max-width:27rem;opacity:0;transform:translateY(20px);
    transition:opacity 3s ease, transform 3s cubic-bezier(.22,1,.36,1);
  }
  #finale.on .txt{opacity:1;transform:none}
  #finale p{
    margin:0 0 1.1rem;font-size:clamp(1.05rem,4.2vw,1.3rem);
    line-height:1.85;font-weight:300;font-style:italic;
    color:rgba(255,246,216,.9);text-shadow:0 2px 26px rgba(0,0,0,.8);
  }
  #finale .sign{
    font-family:var(--script);font-size:clamp(1.6rem,6vw,2rem);
    font-style:normal;color:#ffeeb8;margin-top:.4rem;
  }
  #back{
    margin-top:2rem;pointer-events:auto;font-family:var(--serif);
    font-size:.84rem;letter-spacing:.22em;color:rgba(255,246,216,.45);
    background:none;border:1px solid rgba(246,214,92,.2);border-radius:999px;
    padding:.7rem 1.8rem;cursor:pointer;transition:color .4s,border-color .4s;
  }
  #back:hover,#back:focus-visible{color:#f6d65c;border-color:rgba(246,214,92,.5);outline:none}

  #toast{
    position:fixed;left:50%;top:14vh;transform:translate(-50%,-10px);z-index:15;
    font-size:.95rem;font-style:italic;color:rgba(255,246,216,.8);
    text-shadow:0 2px 20px #000;opacity:0;transition:opacity .8s ease,transform .8s ease;
    pointer-events:none;text-align:center;padding:0 2rem;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  #loader{
    position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:#050308;color:rgba(255,246,216,.5);font-size:.9rem;letter-spacing:.3em;
    transition:opacity .8s ease;
  }
  #loader.gone{opacity:0;pointer-events:none}

  @media (prefers-reduced-motion: reduce){
    #grain{animation:none}
    .intro-eyebrow,.intro-name,.intro-sub,#enter,.intro-foot{animation-duration:.01ms;opacity:1}
  }
</style>
</head>
<body>

<div id="loader">sembrando flores…</div>

<canvas id="gl"></canvas>
<canvas id="petals"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div id="intro">
  <div class="intro-inner">
    <p class="intro-eyebrow"></p>
    <h1 class="intro-name"></h1>
    <p class="intro-sub"></p>
    <button id="enter">Entrar</button>
    <p class="intro-music"><a id="spotify" target="_blank" rel="noopener"></a></p>
    <p class="intro-foot">se ve mejor con sonido y a oscuras</p>
  </div>
</div>

<div id="ytShell" aria-hidden="true"><div id="ytplayer"></div></div>

<div id="chapter"><p id="chapterText"></p></div>

<div id="hud">
  <div id="count">✦ <b>0</b> / 8</div>
  <button id="sound" aria-label="Silenciar música">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5z"/><path id="wave1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="wave2" d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  </button>
  <div id="hint">arrastra para mover el universo<br>toca las flores que laten ✦</div>
</div>

<div id="card" role="dialog" aria-live="polite">
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.6" fill="#8a5a2b"/><g fill="#f6d65c"><ellipse cx="12" cy="6.2" rx="2.1" ry="3.6"/><ellipse cx="12" cy="17.8" rx="2.1" ry="3.6"/><ellipse cx="6.2" cy="12" rx="3.6" ry="2.1"/><ellipse cx="17.8" cy="12" rx="3.6" ry="2.1"/></g></svg>
  <h2 id="cardTitle"></h2>
  <p id="cardText"></p>
  <button id="cardClose">seguir explorando</button>
</div>

<div id="finale">
  <div class="txt">
    <p id="finaleText"></p>
    <p class="sign" id="finaleSign"></p>
    <button id="back">volver a la galaxia</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   UN UNIVERSO PARA JIMENITA
   Galaxia 3D de flores amarillas · Three.js + shaders + WebAudio
   ---------------------------------------------------------------------------
   TODO LO EDITABLE ESTÁ AQUÍ ARRIBA ↓
============================================================================ */

const CONFIG = {
  nombre: "Jimenita",
  firma: "Paul",
  portadaEyebrow: "PARA",
  portadaSub: "Un universo hecho de flores amarillas,<br>sembrado a mano, solo para ti.",
  // Mensajes de las 8 flores especiales (título + texto)
  mensajes: [
    { t:"Donde empieza todo", m:"Antes de ti el espacio era solo espacio. Después de ti, todo esto." },
    { t:"Tu color", m:"Dicen que el amarillo es el color de la alegría. Yo aprendí que el café es el color de volver a casa." },
    { t:"Las cosas pequeñas", m:"Tu risa, cuando algo te da risa de verdad. Ese sonido merecía su propia constelación." },
    { t:"Gravedad", m:"No entiendo del todo la física del corazón, pero sé perfectamente hacia dónde caigo." },
    { t:"Un día cualquiera", m:"No hace falta que pase nada especial. Contigo un martes ya es un buen recuerdo." },
    { t:"Si te sientes lejos", m:"Acuérdate de que existe un universo entero que solo existe porque tú estás en él." },
    { t:"Sin prisa", m:"Las flores no se apuran, y yo tampoco. Quiero todo el tiempo que quieras darme." },
    { t:"La verdad", m:"No es una galaxia. Es la forma más grande que encontré de decirte lo que siento." }
  ],
  // Subtítulos del viaje inicial
  capitulos: [
    { t:2.0,  d:5.0, txt:"Hay lugares del universo que nadie ha visto todavía." },
    { t:8.0,  d:5.0, txt:"Este es uno de ellos." },
    { t:14.5, d:5.5, txt:"Tardé millones de años luz en sembrarlo." },
  ],
  // Música de la experiencia.
  // El enlace visible abre Yellow en Spotify y, al tocar “Entrar”,
  // el audio se reproduce dentro de la página mediante el video oficial de YouTube.
  musica: {
    spotify: "https://open.spotify.com/intl-es/track/3AJwUDP919kvQ9QcozQPxg?si=25191c6537794351",
    etiqueta: "Yellow · Coldplay",
    youtubeId: "yKNxeF4KMsY",
    archivo: ""
  },
  finalDespertar: "el corazón del universo despertó",
  finalTexto: "Cada flor de aquí es una manera distinta de decirte gracias por existir.",
  finalFirma: "Con todo mi cariño, "
};

/* --- red de seguridad: el cargador nunca debe quedarse pegado --- */
function hideLoader(){
  const l=document.getElementById('loader');
  if(l && !l.classList.contains('gone')){ l.classList.add('gone'); setTimeout(()=>l.remove(),900); }
}
setTimeout(hideLoader, 2600);
window.addEventListener('error', ()=>{
  hideLoader();
  const sub=document.querySelector('.intro-sub');
  if(sub && !sub.textContent.trim()) sub.textContent='No se pudo cargar el universo. Revisa tu conexión y recarga la página.';
});

/* ========================= utilidades ========================= */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const smooth=(cur,tar,lambda,dt)=>lerp(cur,tar,1-Math.exp(-lambda*dt));
const rnd=(a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const TAU=Math.PI*2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 760;
const TIER = isMobile ? 0 : (window.innerWidth < 1500 ? 1 : 2);
const COUNT  = [46000, 92000, 140000][TIER];
const STARS  = [1800, 3000, 4200][TIER];
const FLY    = [420, 700, 900][TIER];

/* ========================= texturas procedurales ========================= */
function cv(size){ const c=document.createElement('canvas'); c.width=c.height=size; return c; }

// Dibuja una flor en el contexto dado, centrada en (cx,cy)
function drawFlower(g,cx,cy,R,petals,petalW,centerCol,petalCols,soft){
  g.save(); g.translate(cx,cy);
  // halo
  const halo=g.createRadialGradient(0,0,0,0,0,R*1.35);
  halo.addColorStop(0,'rgba(255,240,190,'+(soft?.55:.38)+')');
  halo.addColorStop(.45,'rgba(224,154,40,.14)');
  halo.addColorStop(1,'rgba(224,154,40,0)');
  g.fillStyle=halo; g.beginPath(); g.arc(0,0,R*1.35,0,TAU); g.fill();
  // pétalos
  for(let i=0;i<petals;i++){
    const a=i/petals*TAU;
    g.save(); g.rotate(a);
    const grd=g.createLinearGradient(0,-R*.15,0,-R);
    grd.addColorStop(0,petalCols[0]); grd.addColorStop(.55,petalCols[1]); grd.addColorStop(1,petalCols[2]);
    g.fillStyle=grd;
    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(petalW*R,-R*.32, petalW*R*.85,-R*.92, 0,-R);
    g.bezierCurveTo(-petalW*R*.85,-R*.92, -petalW*R,-R*.32, 0,0);
    g.fill();
    g.restore();
  }
  // centro café (el color favorito de ella)
  const c2=g.createRadialGradient(-R*.06,-R*.06,0,0,0,R*.34);
  c2.addColorStop(0,'#c98a3e'); c2.addColorStop(.5,centerCol); c2.addColorStop(1,'#2a150b');
  g.fillStyle=c2; g.beginPath(); g.arc(0,0,R*.32,0,TAU); g.fill();
  // brillo del centro
  g.fillStyle='rgba(255,240,200,.5)';
  g.beginPath(); g.arc(-R*.09,-R*.1,R*.09,0,TAU); g.fill();
  g.restore();
}

function makeAtlas(){
  const S=512, c=cv(S), g=c.getContext('2d');
  const cell=S/2, R=cell*0.40;
  const variants=[
    {p:5,  w:.52, cc:'#7a4a20', cols:['#fff3c8','#f6d65c','#e0921f']},
    {p:8,  w:.34, cc:'#6b3f1d', cols:['#fffbe8','#ffe07a','#d98a24']},
    {p:6,  w:.44, cc:'#8a5a2b', cols:['#fff6d8','#ffd23f','#b9661d']},
    {p:12, w:.24, cc:'#5c3417', cols:['#fffdf0','#f7e08c','#e8a72e']}
  ];
  variants.forEach((v,i)=>{
    const cx=(i%2)*cell+cell/2, cy=Math.floor(i/2)*cell+cell/2;
    drawFlower(g,cx,cy,R,v.p,v.w,v.cc,v.cols,false);
  });
  const t=new THREE.CanvasTexture(c);
  t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  return t;
}

function makeBigFlower(){
  const S=512, c=cv(S), g=c.getContext('2d');
  drawFlower(g,S/2,S/2,S*0.33,10,.32,'#7a4a20',['#fffdf2','#ffe98f','#eaa62c'],true);
  const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
}

function makeGlow(inner, outer){
  const S=256, c=cv(S), g=c.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,inner); gr.addColorStop(.25,outer);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
}

function makeStar(){
  const S=64,c=cv(S),g=c.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(255,250,230,1)');
  gr.addColorStop(.3,'rgba(255,225,150,.5)');
  gr.addColorStop(1,'rgba(255,200,100,0)');
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
}

/* ========================= Yellow · reproductor interno ========================= */
const YTMusic = (()=>{
  let player=null, ready=false, wanted=false, enabled=true;

  function tryPlay(){
    wanted=true;
    if(!ready || !player || !enabled) return;
    try{
      player.unMute();
      player.setVolume(58);
      player.playVideo();
    }catch(e){}
  }

  function pause(){
    wanted=false;
    if(player && ready){
      try{ player.pauseVideo(); }catch(e){}
    }
  }

  function toggle(){
    enabled=!enabled;
    if(enabled) tryPlay();
    else pause();
    return enabled;
  }

  if(CONFIG.musica && CONFIG.musica.youtubeId){
    const id=CONFIG.musica.youtubeId;

    window.onYouTubeIframeAPIReady=()=>{
      player=new YT.Player('ytplayer',{
        width:220,
        height:124,
        videoId:id,
        playerVars:{
          playsinline:1,
          controls:0,
          disablekb:1,
          fs:0,
          rel:0,
          modestbranding:1,
          loop:1,
          playlist:id
        },
        events:{
          onReady:()=>{
            ready=true;
            if(wanted && enabled) tryPlay();
          },
          onStateChange:(e)=>{
            if(window.YT && e.data===YT.PlayerState.ENDED && enabled){
              try{ player.playVideo(); }catch(err){}
            }
          }
        }
      });
    };

    const ytScript=document.createElement('script');
    ytScript.src='https://www.youtube.com/iframe_api';
    ytScript.async=true;
    document.head.appendChild(ytScript);
  }

  return { play:tryPlay, pause, toggle };
})();

const Sound = (()=>{
  let ctx, master, wet, conv, pad=[], padFilter, padGain, on=true, started=false, chordIdx=0, timer=null;
  let quiet=false, track=null;
  const CHORDS=[
    [174.61,220.00,261.63,329.63], // Fmaj7
    [130.81,164.81,196.00,246.94], // Cmaj7
    [110.00,130.81,164.81,196.00], // Am7
    [146.83,174.61,220.00,261.63]  // Dm7
  ];
  const PENTA=[349.23,392.00,440.00,523.25,587.33,698.46,783.99,880.00];

  function impulse(sec, decay){
    const rate=ctx.sampleRate, len=rate*sec, buf=ctx.createBuffer(2,len,rate);
    for(let ch=0;ch<2;ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
    }
    return buf;
  }
  function start(silencioso){
    if(started) return; started=true;
    quiet=!!silencioso;

    // Igual que en la versión de Mónaco: el toque en “Entrar” habilita
    // la reproducción del tema dentro de la página.
    if(CONFIG.musica && CONFIG.musica.youtubeId){
      quiet=true;
      YTMusic.play();
      return;
    }

    // Si hay un archivo de audio propio, suena ese en vez del ambiente sintetizado
    if(CONFIG.musica && CONFIG.musica.archivo){
      try{
        track=new Audio(CONFIG.musica.archivo);
        track.loop=true; track.volume=0;
        track.play().then(()=>{
          let v=0; const f=setInterval(()=>{ v=Math.min(.75,v+.02); track.volume=v; if(v>=.75) clearInterval(f); },140);
        }).catch(()=>{});
        quiet=true;
      }catch(e){}
    }
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    conv=ctx.createConvolver(); conv.buffer=impulse(3.4,2.6);
    wet=ctx.createGain(); wet.gain.value=.85; conv.connect(wet); wet.connect(master);
    padFilter=ctx.createBiquadFilter(); padFilter.type='lowpass';
    padFilter.frequency.value=520; padFilter.Q.value=.6;
    padGain=ctx.createGain(); padGain.gain.value=quiet?0:.16;
    padFilter.connect(padGain); padGain.connect(master); padGain.connect(conv);
    // LFO sobre el filtro: respiración
    const lfo=ctx.createOscillator(), lfoG=ctx.createGain();
    lfo.frequency.value=.045; lfoG.gain.value=260;
    lfo.connect(lfoG); lfoG.connect(padFilter.frequency); lfo.start();
    for(let i=0;i<4;i++){
      const o=ctx.createOscillator(); o.type= i<2?'sine':'triangle';
      o.frequency.value=CHORDS[0][i];
      const g=ctx.createGain(); g.gain.value=i<2?.5:.28;
      const det=ctx.createOscillator(), detG=ctx.createGain();
      det.frequency.value=.07+i*.013; detG.gain.value=1.4;
      det.connect(detG); detG.connect(o.detune); det.start();
      o.connect(g); g.connect(padFilter); o.start();
      pad.push(o);
    }
    master.gain.linearRampToValueAtTime(quiet?.30:.55, ctx.currentTime+6);
    timer=setInterval(nextChord, 9000);
    setInterval(()=>{ if(on && Math.random()<.5) bell(PENTA[(Math.random()*PENTA.length)|0]*(Math.random()<.35?2:1), .09); }, 5200);
  }
  function nextChord(){
    if(!ctx) return; chordIdx=(chordIdx+1)%CHORDS.length;
    pad.forEach((o,i)=>o.frequency.setTargetAtTime(CHORDS[chordIdx][i], ctx.currentTime, 1.6));
  }
  function bell(f,vol=.22,dur=3.2){
    if(!ctx||!on) return;
    const t=ctx.currentTime, g=ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    g.connect(master); g.connect(conv);
    [[1,1],[2.01,.4],[3.01,.18],[4.7,.08]].forEach(([m,a])=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*m;
      const og=ctx.createGain(); og.gain.value=a;
      o.connect(og); og.connect(g); o.start(t); o.stop(t+dur+.1);
    });
  }
  return {
    start,
    chime(i=0){ bell(PENTA[i%PENTA.length]*2, .26, 3.6); },
    open(){ bell(PENTA[2]*2,.2,2.6); setTimeout(()=>bell(PENTA[4]*2,.14,3),140); },
    swell(){
      if(!ctx) return;
      [0,1,2,4,5,7].forEach((n,i)=>setTimeout(()=>bell(PENTA[n]*(i>3?2:1), .3, 6), i*260));
      master.gain.setTargetAtTime(.8, ctx.currentTime, 2);
    },
    calm(){ if(ctx) master.gain.setTargetAtTime(quiet?.30:.55, ctx.currentTime, 3); },
    toggle(){
      if(CONFIG.musica && CONFIG.musica.youtubeId){
        on=YTMusic.toggle();
        return on;
      }
      on=!on;
      if(ctx) master.gain.setTargetAtTime(on?(quiet?.30:.55):0, ctx.currentTime, .4);
      if(track) track.volume=on?.75:0;
      return on;
    }
  };
})();

/* ---------- geometría de la galaxia ---------- */
function buildGalaxy(){
  const pos=new Float32Array(COUNT*3);
  const col=new Float32Array(COUNT*3);
  const size=new Float32Array(COUNT);
  const ang=new Float32Array(COUNT);
  const spin=new Float32Array(COUNT);
  const seed=new Float32Array(COUNT);
  const tex=new Float32Array(COUNT);

  const cCore=new THREE.Color('#fff4cf');
  const cArm =new THREE.Color('#ffd23f');
  const cEdge=new THREE.Color('#c2701f');
  const cDeep=new THREE.Color('#7a3f12');
  const branches=5, tmp=new THREE.Color();

  for(let i=0;i<COUNT;i++){
    const i3=i*3;
    const roll=Math.random();
    let x,y,z,r;

    if(roll<0.12){
      // bulbo esférico del núcleo
      r=Math.pow(Math.random(),2.1)*GAL_R*0.26;
      const th=Math.random()*TAU, ph=Math.acos(2*Math.random()-1);
      x=r*Math.sin(ph)*Math.cos(th); y=r*Math.cos(ph)*0.8; z=r*Math.sin(ph)*Math.sin(th);
      r=Math.hypot(x,z);
    } else if(roll<0.19){
      // halo lejano / flores perdidas
      r=GAL_R*(1.05+Math.random()*1.5);
      const th=Math.random()*TAU, ph=Math.acos(2*Math.random()-1);
      x=r*Math.sin(ph)*Math.cos(th); y=r*Math.cos(ph)*0.55; z=r*Math.sin(ph)*Math.sin(th);
      r=Math.hypot(x,z);
    } else {
      // brazos espirales
      r=Math.pow(Math.random(),1.55)*GAL_R;
      const branch=(i%branches)/branches*TAU;
      const spinA=r*0.0118;
      const tight=0.30+0.45*(r/GAL_R);
      const rx=(Math.pow(Math.random(),3)*(Math.random()<.5?1:-1))*tight*r*0.42;
      const rz=(Math.pow(Math.random(),3)*(Math.random()<.5?1:-1))*tight*r*0.42;
      const ry=(Math.pow(Math.random(),3)*(Math.random()<.5?1:-1))*(28*(1-r/GAL_R*0.72)+6);
      const a=branch+spinA;
      x=Math.cos(a)*r+rx; z=Math.sin(a)*r+rz; y=ry;
      r=Math.hypot(x,z);
    }

    pos[i3]=x; pos[i3+1]=y; pos[i3+2]=z;

    const t=clamp(r/GAL_R,0,1.4);
    if(t<0.30) tmp.copy(cCore).lerp(cArm, t/0.30);
    else if(t<0.78) tmp.copy(cArm).lerp(cEdge,(t-0.30)/0.48);
    else tmp.copy(cEdge).lerp(cDeep,clamp((t-0.78)/0.5,0,1));
    const v=0.72+Math.random()*0.42;
    col[i3]=tmp.r*v; col[i3+1]=tmp.g*v; col[i3+2]=tmp.b*v;

    size[i]=(0.45+Math.pow(Math.random(),2.4)*2.3)*(1+(1-t)*0.5);
    ang[i]=Math.random()*TAU;
    spin[i]=(Math.random()-0.5)*0.55;
    seed[i]=Math.random();
    tex[i]=(Math.random()*4)|0;
  }
  return {pos,col,size,ang,spin,seed,tex};
}

/* ---------- nubes de destino: corazón y nombre ---------- */
function heartPool(n){
  const out=[]; let guard=0;
  while(out.length<n*3 && guard<n*80){
    guard++;
    const x=rnd(-1.18,1.18), y=rnd(-0.7,0.7), z=rnd(-1.05,1.18);
    const a=x*x+2.25*y*y+z*z-1;
    if(a*a*a - x*x*z*z*z - 0.1125*y*y*z*z*z <= 0){
      out.push(x,z,y); // z arriba → eje Y del mundo
    }
  }
  return out;
}

function textPool(text, font, wWorld){
  const W=1500,H=420,c=cv(2); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
  g.font=font;
  g.fillText(text,W/2,H/2+10);
  const d=g.getImageData(0,0,W,H).data, pts=[];
  const step= isMobile?2:2;
  for(let y=0;y<H;y+=step) for(let x=0;x<W;x+=step){
    if(d[(y*W+x)*4]>110) pts.push(x,y);
  }
  const scale=wWorld/W;
  const out=new Float32Array(pts.length/2*3);
  for(let i=0,j=0;i<pts.length;i+=2,j+=3){
    out[j]  =(pts[i]-W/2)*scale;
    out[j+1]=(H/2-pts[i+1])*scale;
    out[j+2]=rnd(-7,7);
  }
  return out;
}

/* ---------- material de flores con morphing ---------- */
const flowerUniforms={
  uTime:{value:0}, uPR:{value:DPR}, uSize:{value:isMobile?26:34},
  uAtlas:{value:atlas}, uOpacity:{value:0},
  uHeart:{value:0}, uText:{value:0}, uPulse:{value:0}, uSpread:{value:1}
};

const VERT=`
uniform float uTime, uPR, uSize, uHeart, uText, uPulse, uSpread;
attribute float aSize, aAngle, aSpin, aSeed, aTex;
attribute vec3 aHeart, aText, aColor;
varying vec3 vColor; varying float vAngle; varying float vTex; varying float vTw;
void main(){
  vec3 p = position * uSpread;
  float r = length(p.xz);
  // rotación diferencial de la galaxia
  float a = uTime * (0.075 / (0.55 + r*0.0125));
  float s = sin(a), c = cos(a);
  p.xz = vec2(p.x*c - p.z*s, p.x*s + p.z*c);
  p.y += sin(uTime*0.4 + aSeed*6.2831)*(1.0 + r*0.006);

  vec3 h = aHeart * (1.0 + uPulse*0.045);
  vec3 tp = mix(p, h, uHeart);
  tp = mix(tp, aText, uText);
  float m = max(uHeart, uText);
  tp += vec3(sin(uTime*0.7+aSeed*31.0), cos(uTime*0.62+aSeed*17.0), sin(uTime*0.55+aSeed*11.0)) * m * 1.6;

  vec4 mv = modelViewMatrix * vec4(tp,1.0);
  gl_Position = projectionMatrix * mv;
  float ps = uSize * aSize * uPR * (110.0 / max(1.0, -mv.z));
  gl_PointSize = clamp(ps, 0.6, 92.0);

  vColor = mix(aColor, vec3(1.0,0.88,0.58), m*0.55);
  vAngle = aAngle + uTime*aSpin*0.35;
  vTex = aTex;
  vTw = 0.72 + 0.38*sin(uTime*1.5 + aSeed*42.0);
}`;

const FRAG=`
uniform sampler2D uAtlas; uniform float uOpacity;
varying vec3 vColor; varying float vAngle; varying float vTex; varying float vTw;
void main(){
  vec2 uv = (gl_PointCoord - 0.5) * 1.42;
  float s = sin(vAngle), c = cos(vAngle);
  uv = vec2(uv.x*c - uv.y*s, uv.x*s + uv.y*c) + 0.5;
  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) discard;
  vec2 off = vec2(mod(vTex,2.0), floor(vTex*0.5)) * 0.5;
  vec4 t = texture2D(uAtlas, uv*0.5 + off);
  if(t.a < 0.015) discard;
  vec3 col = vColor * t.rgb * vTw;
  gl_FragColor = vec4(col * t.a * uOpacity, t.a * uOpacity);
}`;

/* ---------- nebulosa: discos de polvo dorado/café ---------- */
const nebulaMats=[];
(function nebula(){
  const NEB=`
  varying vec2 vUv;
  uniform float uT; uniform vec3 uC1, uC2; uniform float uOp, uSeed;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
  void main(){
    vec2 uv=vUv-0.5;
    float r=length(uv)*2.0;
    float ang=atan(uv.y,uv.x);
    vec2 q=vec2(ang*1.6 + r*3.4 - uT*0.035, r*3.0 + uSeed*10.0);
    float n=fbm(q*2.2);
    n*= smoothstep(1.0,0.25,r) * smoothstep(0.02,0.30,r);
    vec3 col=mix(uC1,uC2,clamp(n*1.5,0.0,1.0));
    gl_FragColor=vec4(col*n*uOp, n*uOp);
  }`;
  const VS=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `;
  const defs=[
    {r:GAL_R*1.5, y:0,   c1:'#e0921f', c2:'#5c2f10', op:0.42, s:0.3},
    {r:GAL_R*1.1, y:14,  c1:'#ffd23f', c2:'#6b3f1d', op:0.30, s:3.7},
    {r:GAL_R*2.0, y:-26, c1:'#8a5a2b', c2:'#1d0e08', op:0.34, s:7.1}
  ];
  defs.forEach(d=>{
    const m=new THREE.ShaderMaterial({
      uniforms:{uT:{value:0},uC1:{value:new THREE.Color(d.c1)},uC2:{value:new THREE.Color(d.c2)},
                uOp:{value:0},uSeed:{value:d.s}},
      vertexShader:VS, fragmentShader:NEB,
      transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending
    });
    m.userData.base=d.op;
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(d.r*2,d.r*2,1,1),m);
    mesh.rotation.x=-Math.PI/2; mesh.position.y=d.y; mesh.frustumCulled=false;
    scene.add(mesh); nebulaMats.push(m);
  });
})();

/* ---------- capa de flores que pasan junto a la cámara (intro) ---------- */
const flyMat=new THREE.ShaderMaterial({
  uniforms:{uPR:{value:DPR},uAtlas:{value:atlas},uOp:{value:0},uT:{value:0}},
  vertexShader:`uniform float uPR,uT; attribute float aS,aA,aTx; varying float vA; varying float vTx;
    void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_Position=projectionMatrix*mv;
      gl_PointSize=clamp(aS*uPR*(260.0/max(1.0,-mv.z)),1.0,220.0);
      vA=aA+uT*0.6; vTx=aTx; }`,
  fragmentShader:`uniform sampler2D uAtlas; uniform float uOp; varying float vA; varying float vTx;
    void main(){ vec2 uv=(gl_PointCoord-0.5)*1.42; float s=sin(vA),c=cos(vA);
      uv=vec2(uv.x*c-uv.y*s, uv.x*s+uv.y*c)+0.5;
      if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) discard;
      vec2 off=vec2(mod(vTx,2.0), floor(vTx*0.5))*0.5;
      vec4 t=texture2D(uAtlas, uv*0.5+off); if(t.a<0.02) discard;
      gl_FragColor=vec4(t.rgb*vec3(1.0,0.92,0.68)*t.a*uOp, t.a*uOp); }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
const flyPos=new Float32Array(FLY*3), flySpd=new Float32Array(FLY);
(function(){
  const s=new Float32Array(FLY), a=new Float32Array(FLY), tx=new Float32Array(FLY);
  for(let i=0;i<FLY;i++){
    const ang=Math.random()*TAU, rad=14+Math.pow(Math.random(),.6)*170;
    flyPos[i*3]=Math.cos(ang)*rad; flyPos[i*3+1]=Math.sin(ang)*rad; flyPos[i*3+2]=-rnd(20,900);
    flySpd[i]=rnd(70,220); s[i]=rnd(.5,2.6); a[i]=Math.random()*TAU; tx[i]=(Math.random()*4)|0;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(flyPos,3));
  g.setAttribute('aS',new THREE.BufferAttribute(s,1));
  g.setAttribute('aA',new THREE.BufferAttribute(a,1));
  g.setAttribute('aTx',new THREE.BufferAttribute(tx,1));
  const pts=new THREE.Points(g,flyMat); pts.frustumCulled=false;
  camera.add(pts);
  window.__fly=pts;
})();

/* ========================= cámara / controles ========================= */
const cam={
  r:1500, theta:0.6, phi:1.32,
  tr:430, ttheta:0.6, tphi:1.05,
  target:new THREE.Vector3(0,0,0),
  tTarget:new THREE.Vector3(0,0,0),
  auto:0.012, idle:0
};
let dragging=false, lastX=0, lastY=0, moved=0, pinchDist=0, pointers=new Map();

function toXY(e){ return {x:e.clientX, y:e.clientY}; }
canvas.addEventListener('pointerdown', e=>{
  pointers.set(e.pointerId, toXY(e));
  if(pointers.size===1){ dragging=true; lastX=e.clientX; lastY=e.clientY; moved=0; cam.idle=0; }
  if(pointers.size===2){ const p=[...pointers.values()]; pinchDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); }
});
canvas.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, toXY(e));
  if(pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchDist){ cam.tr=clamp(cam.tr*(pinchDist/d),110,1500); }
    pinchDist=d; moved+=12; return;
  }
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  if(state==='explore'||state==='message'){
    cam.ttheta+=dx*0.0042;
    cam.tphi=clamp(cam.tphi-dy*0.0035, 0.16, Math.PI-0.16);
    cam.idle=0;
  }
});
function endPointer(e){
  const had=pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchDist=0;
  if(pointers.size===0){
    if(had && dragging && moved<9) tap(e.clientX,e.clientY);
    dragging=false;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.tr=clamp(cam.tr*(1+Math.sign(e.deltaY)*0.09),110,1500); cam.idle=0;
},{passive:false});
window.addEventListener('keydown',e=>{
  if(state!=='explore') return;
  if(e.key==='ArrowLeft') cam.ttheta-=0.12;
  if(e.key==='ArrowRight') cam.ttheta+=0.12;
  if(e.key==='ArrowUp') cam.tphi=clamp(cam.tphi-0.08,0.16,Math.PI-0.16);
  if(e.key==='ArrowDown') cam.tphi=clamp(cam.tphi+0.08,0.16,Math.PI-0.16);
  if(e.key==='Enter'||e.key===' ') tap(innerWidth/2, innerHeight/2);
});

/* ========================= pétalos 2D ========================= */
const pcv=document.getElementById('petals'), pg=pcv.getContext('2d');
let petals=[], petalRate=0;
function addPetal(x,y,burst){
  petals.push({
    x:x!==undefined?x:rnd(-60,innerWidth+60),
    y:y!==undefined?y:-40,
    vx:burst?rnd(-2.6,2.6):rnd(-.5,.5),
    vy:burst?rnd(-3.2,1.2):rnd(.5,1.7),
    r:rnd(0,TAU), vr:rnd(-.035,.035),
    s:rnd(5,15), a:0, life:0, max:rnd(6,13),
    hue:rnd(38,52)
  });
}
function drawPetals(dt){
  pg.clearRect(0,0,pcv.width,pcv.height);
  petalRate=Math.max(0,petalRate-dt*0.25);
  if(petals.length<(isMobile?70:130) && (Math.random()<0.035+petalRate)) addPetal();
  for(let i=petals.length-1;i>=0;i--){
    const p=petals[i];
    p.life+=dt; p.vy+=dt*0.35; p.vx+=Math.sin(p.life*1.6+p.r)*dt*0.5;
    p.x+=p.vx*dt*46; p.y+=p.vy*dt*46; p.r+=p.vr;
    p.a = p.life<1 ? p.life : clamp((p.max-p.life)/2,0,1);
    if(p.life>p.max || p.y>innerHeight+60){ petals.splice(i,1); continue; }
    pg.save();
    pg.translate(p.x*DPR2,p.y*DPR2); pg.rotate(p.r); pg.scale(DPR2,DPR2);
    pg.globalAlpha=p.a*0.75;
    const g2=pg.createLinearGradient(0,-p.s,0,p.s);
    g2.addColorStop(0,`hsla(${p.hue},95%,78%,1)`);
    g2.addColorStop(1,`hsla(${p.hue-12},80%,48%,.5)`);
    pg.fillStyle=g2;
    pg.beginPath();
    pg.ellipse(0,0,p.s*0.42,p.s,0,0,TAU);
    pg.fill();
    pg.restore();
  }
}
let DPR2=Math.min(window.devicePixelRatio||1,2);

/* ========================= UI ========================= */
const ui={
  intro:document.getElementById('intro'),
  enter:document.getElementById('enter'),
  chapter:document.getElementById('chapterText'),
  hud:document.getElementById('hud'),
  count:document.querySelector('#count b'),
  hint:document.getElementById('hint'),
  card:document.getElementById('card'),
  cardTitle:document.getElementById('cardTitle'),
  cardText:document.getElementById('cardText'),
  cardClose:document.getElementById('cardClose'),
  finale:document.getElementById('finale'),
  finaleText:document.getElementById('finaleText'),
  finaleSign:document.getElementById('finaleSign'),
  back:document.getElementById('back'),
  toast:document.getElementById('toast'),
  sound:document.getElementById('sound'),
  loader:document.getElementById('loader')
};
document.querySelector('.intro-eyebrow').textContent=CONFIG.portadaEyebrow;
document.querySelector('.intro-name').textContent=CONFIG.nombre;
document.querySelector('.intro-sub').innerHTML=CONFIG.portadaSub;
ui.finaleText.textContent=CONFIG.finalTexto;
ui.finaleSign.textContent=CONFIG.finalFirma+CONFIG.firma;

let toastTimer=null;
function toast(msg,ms=3200){
  ui.toast.textContent=msg; ui.toast.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>ui.toast.classList.remove('on'),ms);
}

/* ========================= estados ========================= */
let state='intro';      // intro → fly → explore → message → finale
let T=0, tState=0, found=0, chaptersDone=0, activeFlower=null;
let fin={t:0,phase:0,theta:0};
let specialFade=1, specialsShown=false, nudge=0;

let usaSpotify=false;
(function(){
  const a=document.getElementById('spotify');
  if(!a || !CONFIG.musica || !CONFIG.musica.spotify){ if(a) a.parentNode.style.display='none'; return; }
  a.href=CONFIG.musica.spotify;
  a.textContent='♪ '+CONFIG.musica.etiqueta;
  a.addEventListener('click',()=>{ usaSpotify=true; a.textContent='♪ ahora toca Entrar'; });
})();

ui.enter.addEventListener('click',()=>{
  Sound.start(usaSpotify);
  ui.intro.classList.add('gone');
  state='fly'; tState=0;
  cam.r=1500; cam.theta=0.6; cam.phi=1.32;
  if(reduceMotion){ cam.r=470; tState=18; }
});
ui.cardClose.addEventListener('click', closeCard);
ui.sound.addEventListener('click',()=>{
  const on=Sound.toggle();
  ui.sound.style.color= on? '' : 'rgba(255,246,216,.22)';
  document.getElementById('wave1').style.opacity=on?1:.15;
  document.getElementById('wave2').style.opacity=on?1:.15;
  ui.sound.setAttribute('aria-label', on?'Silenciar música':'Activar música');
});
ui.back.addEventListener('click',()=>{
  ui.finale.classList.remove('on');
  fin.phase=6; fin.t=0; Sound.calm();
});

function openCard(f){
  activeFlower=f;
  const msg=CONFIG.mensajes[f.idx] || {t:'✦',m:'…'};
  ui.cardTitle.textContent=msg.t;
  ui.cardText.textContent=msg.m;
  ui.card.classList.add('on');
  state='message'; 
  cam.tr=Math.max(190, cam.tr*0.72);
  Sound.open();
  petalRate=1.2;
  const s=f.grp.position.clone().project(camera);
  for(let i=0;i<26;i++) addPetal((s.x*.5+.5)*innerWidth, (-s.y*.5+.5)*innerHeight, true);
  if(!f.found){
    f.found=true; found++;
    if(found===1 && ui.hint) ui.hint.style.opacity=0;
    ui.count.textContent=found;
    Sound.chime(found);
    if(found===8) setTimeout(()=>toast(CONFIG.finalDespertar+' · toca el centro',5200), 2400);
  }
}
function closeCard(){
  ui.card.classList.remove('on');
  activeFlower=null;
  if(state==='message'){ state='explore'; cam.tr=clamp(cam.tr*1.25,110,1500); }
}

/* ---------- tap: flores especiales y núcleo ---------- */
const v3=new THREE.Vector3();
function tap(px,py){
  if(state!=='explore' && state!=='message') return;
  let best=null, bestD=1e9;
  const hitR=isMobile?64:52;
  special.forEach(f=>{
    if(!f.grp.visible) return;
    v3.copy(f.grp.position).project(camera);
    if(v3.z>1) return;
    const sx=(v3.x*.5+.5)*innerWidth, sy=(-v3.y*.5+.5)*innerHeight;
    const d=Math.hypot(sx-px,sy-py);
    if(d<hitR*f.scale && d<bestD){ bestD=d; best=f; }
  });
  if(best){ openCard(best); return; }
  // ¿tocó el centro?
  v3.set(0,0,0).project(camera);
  const cx=(v3.x*.5+.5)*innerWidth, cy=(-v3.y*.5+.5)*innerHeight;
  if(Math.hypot(cx-px,cy-py) < (isMobile?80:70)){
    if(found>=8){ startFinale(); }
    else toast(`todavía hay flores dormidas · ${found}/8`);
    return;
  }
  if(state==='message') closeCard();
}

/* ---------- gran final ---------- */
function startFinale(){
  state='finale';
  fin={t:0,phase:1,theta:Math.round((cam.ttheta-Math.PI*0.5)/TAU)*TAU + Math.PI*0.5};
  closeCard();
  ui.hud.classList.remove('on');
  Sound.swell();
  cam.tTarget.set(0,10,0);
}

/* ========================= bucle ========================= */
const clock=new THREE.Clock();
let heartV=0, textV=0, spreadV=1;

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  DPR2=Math.min(window.devicePixelRatio||1,2);
  pcv.width=w*DPR2; pcv.height=h*DPR2;
  pcv.style.width=w+'px'; pcv.style.height=h+'px';
  flowerUniforms.uSize.value = (w<520?22:(w<900?27:34));
}
addEventListener('resize',resize); resize();

function updateChapters(){
  if(state!=='fly') return;
  const c=CONFIG.capitulos[chaptersDone];
  if(c && tState>=c.t){
    ui.chapter.textContent=c.txt;
    ui.chapter.classList.add('on');
    chaptersDone++;
    setTimeout(()=>ui.chapter.classList.remove('on'), c.d*1000);
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  T+=dt; tState+=dt;

  flowerUniforms.uTime.value=T;
  flyMat.uniforms.uT.value=T;
  if(window.__stars) window.__stars.uniforms.uT.value=T;
  nebulaMats.forEach(m=>m.uniforms.uT.value=T);

  /* --- estados --- */
  if(state==='fly'){
    const d=clamp(tState/17,0,1), e=easeInOut(d);
    cam.r   = lerp(1500, 470, e);
    cam.phi = lerp(1.34, 1.02, e);
    cam.theta = 0.6 + tState*0.028;
    cam.tr=cam.r; cam.tphi=cam.phi; cam.ttheta=cam.theta;
    flowerUniforms.uOpacity.value=clamp(tState/6,0,1);
    if(window.__stars) window.__stars.uniforms.uOp.value=clamp(tState/4,0,1);
    nebulaMats.forEach(m=>m.uniforms.uOp.value=m.userData.base*clamp((tState-2)/7,0,1));
    coreGlow.material.opacity=clamp((tState-3)/8,0,1)*0.85;
    flyMat.uniforms.uOp.value=clamp(tState/2,0,1)*clamp((15-tState)/4,0,1);
    updateChapters();
    if(tState>17.2){
      state='explore'; tState=0;
      ui.hud.classList.add('on');
      specialsShown=true;
      coreFlower.material.opacity=0.0;
    }
  }

  if(state==='explore'||state==='message'){
    cam.idle+=dt;
    // la pista se queda hasta que encuentra la primera flor
    if(found===0){
      if(tState>24 && nudge===0){ nudge=1; toast('las flores más grandes guardan un mensaje · tócalas',5000); }
      else if(tState>70 && nudge===1){ nudge=2; toast('busca las que laten en los brazos de la galaxia',5000); }
    }
    if(cam.idle>2.5 && !dragging) cam.ttheta += dt*0.016;
    coreFlower.material.opacity = smooth(coreFlower.material.opacity, found>=8?0.95:0.28, 1.5, dt);
    coreFlower.scale.setScalar(52*(1+(found>=8?0.16:0.05)*Math.sin(T*(found>=8?2.2:1.0))));
    flowerUniforms.uOpacity.value = smooth(flowerUniforms.uOpacity.value, state==='message'?0.55:1.0, 2.2, dt);
  }

  if(state==='finale'){
    fin.t+=dt;
    const f=fin;
    if(f.phase===1){                                   // recoger la cámara
      cam.ttheta = smooth(cam.ttheta, f.theta, 1.0, dt);
      cam.tphi   = smooth(cam.tphi, 1.35, 1.0, dt);
      cam.tr     = smooth(cam.tr, 360, 1.0, dt);
      specialFade = Math.max(0, specialFade - dt*0.55);
      nebulaMats.forEach(m=>m.uniforms.uOp.value=Math.max(0,m.uniforms.uOp.value-dt*m.userData.base*0.35));
      if(f.t>3.4){ f.phase=2; f.t=0; }
    } else if(f.phase===2){                            // nace el corazón
      heartV=clamp(f.t/4.5,0,1);
      spreadV=lerp(1,0.85,easeOut(heartV));
      if(f.t>6.2){ f.phase=3; f.t=0; petalRate=2.4; }
    } else if(f.phase===3){                            // late
      flowerUniforms.uPulse.value=Math.sin(f.t*3.0)*Math.exp(-((f.t%1.05)*3.0))*1.6+Math.sin(f.t*1.6)*0.4;
      if(f.t>4.2){ f.phase=4; f.t=0; }
    } else if(f.phase===4){                            // se escribe el nombre
      flowerUniforms.uPulse.value*=0.94;
      textV=clamp(f.t/3.6,0,1);
      cam.tr=smooth(cam.tr,330,0.8,dt);
      cam.tphi=smooth(cam.tphi,Math.PI/2,0.8,dt);
      cam.ttheta=smooth(cam.ttheta,f.theta,0.8,dt);
      if(f.t>4.4){ f.phase=5; f.t=0; ui.finale.classList.add('on'); petalRate=3.0; }
    } else if(f.phase===5){
      petalRate=Math.max(petalRate,1.1);
    } else if(f.phase===6){                            // volver a la galaxia
      textV=smooth(textV,0,1.4,dt); heartV=smooth(heartV,0,0.9,dt); spreadV=smooth(spreadV,1,0.9,dt);
      specialFade=Math.min(1, specialFade+dt*0.4);
      if(f.t>4.2){
        state='explore'; tState=0; ui.hud.classList.add('on');
        nebulaMats.forEach(m=>m.uniforms.uOp.value=m.userData.base);
      }
    }
    flowerUniforms.uHeart.value=heartV;
    flowerUniforms.uText.value=textV;
    flowerUniforms.uSpread.value=spreadV;
  }

  /* --- cámara suave --- */
  cam.r     = smooth(cam.r, cam.tr, 2.4, dt);
  cam.theta = smooth(cam.theta, cam.ttheta, 3.0, dt);
  cam.phi   = smooth(cam.phi, cam.tphi, 3.0, dt);
  cam.target.lerp(cam.tTarget, 1-Math.exp(-2*dt));
  const sp=Math.sin(cam.phi);
  camera.position.set(
    cam.target.x + cam.r*sp*Math.cos(cam.theta),
    cam.target.y + cam.r*Math.cos(cam.phi) + Math.sin(T*0.25)*4,
    cam.target.z + cam.r*sp*Math.sin(cam.theta)
  );
  camera.lookAt(cam.target);

  /* --- flores especiales siguen la rotación de la galaxia --- */
  if(state!=='finale') specialFade=Math.min(1, specialFade+dt*0.5);
  special.forEach(f=>{
    const b=f.base, r=Math.hypot(b.x,b.z);
    const a=T*(0.075/(0.55+r*0.0125));
    const s=Math.sin(a), c=Math.cos(a);
    f.grp.position.set(
      (b.x*c-b.z*s)*spreadV,
      (b.y + Math.sin(T*0.4+f.idx)*3)*spreadV,
      (b.x*s+b.z*c)*spreadV
    );
    f.pulse+=dt*(f.found?0.9:1.5);
    const pulse=1+Math.sin(f.pulse)*(f.found?0.07:0.16);
    f.scale=pulse;
    f.halo.scale.setScalar((f.found?52:74)*pulse);
    f.fl.scale.setScalar(30*pulse);
    f.halo.material.opacity=(f.found?0.3:0.62)*pulse*specialFade;
    f.fl.material.opacity=specialFade;
    f.grp.visible = specialsShown && specialFade>0.02;
  });

  // flores que pasan junto a la cámara (solo intro)
  if(flyMat.uniforms.uOp.value>0.001){
    const arr=window.__fly.geometry.attributes.position.array;
    for(let i=0;i<FLY;i++){
      arr[i*3+2]+=flySpd[i]*dt*3.2;
      if(arr[i*3+2]>10){
        arr[i*3+2]=-900;
        const ang=Math.random()*TAU, rad=14+Math.pow(Math.random(),.6)*170;
        arr[i*3]=Math.cos(ang)*rad; arr[i*3+1]=Math.sin(ang)*rad;
      }
    }
    window.__fly.geometry.attributes.position.needsUpdate=true;
  }

  coreGlow.scale.setScalar(300*(1+Math.sin(T*0.5)*0.03)*spreadV);
  coreGlow.material.opacity = state==='finale'&&fin.phase>=2
    ? Math.max(0, coreGlow.material.opacity-dt*0.4)
    : Math.min(0.85, coreGlow.material.opacity + (state!=='intro'?dt*0.1:0));

  drawPetals(dt);
  renderer.render(scene,camera);
}

/* ---------- arranque ---------- */
function boot(){
  try{ assignName(); }catch(e){}
  hideLoader();
  animate();
}
if(document.fonts && document.fonts.load){
  Promise.race([
    document.fonts.load('300 250px "Great Vibes"').then(()=>document.fonts.ready),
    new Promise(r=>setTimeout(r,2500))
  ]).then(boot).catch(boot);
} else boot();

document.addEventListener('visibilitychange',()=>{ clock.getDelta(); });
</script>
